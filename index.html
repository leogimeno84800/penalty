<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penalty</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bowlby+One&family=Rubik:wght@400;600;700&display=swap">
<style>
/* Layout: one full-screen canvas (dark indoor room, striped back wall, 4 glowing boxes), HUD floating on top */
:root{
  --night:#050707; --chalk:#f1f4f0; --mint:#6ff2bf; --mint-dark:#239c72; --coral:#ff6b4a; --ink:#06100c;
  --display:"Bowlby One", Impact, "Arial Black", sans-serif;
  --body:"Rubik", system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--chalk);font-family:var(--body);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.left{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.logo{font-family:var(--display);font-size:clamp(22px,6vw,32px);letter-spacing:.04em;line-height:1;color:var(--chalk);text-shadow:0 3px 0 var(--ink)}
.logo span{color:var(--mint)}
.score{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.dots{display:flex;gap:6px}
.dot{width:16px;height:16px;border-radius:3px;border:2px solid var(--mint);background:var(--mint);box-shadow:0 0 10px var(--mint);transition:background .25s,box-shadow .25s,border-color .25s}
.dot.on{background:transparent;border-color:rgba(241,244,240,.35);box-shadow:none}
.clock{font-family:var(--display);font-size:clamp(24px,7vw,34px);line-height:1;color:var(--mint);text-shadow:0 3px 0 var(--ink);font-variant-numeric:tabular-nums}
.clock.low{color:var(--coral)}
.shots{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.8;font-variant-numeric:tabular-nums}
.hint{position:fixed;left:0;right:0;bottom:0;text-align:center;font-size:15px;font-weight:600;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none;opacity:.85;transition:opacity .3s}
.hint.off{opacity:0}
.win{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,7,7,.72);backdrop-filter:blur(3px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.card h2{margin:0;font-family:var(--display);font-size:clamp(44px,13vw,84px);line-height:.95;color:var(--mint);text-shadow:0 5px 0 var(--ink);text-wrap:balance}
.card p{margin:0;font-size:18px;max-width:30ch}
button{font-family:var(--display);font-size:22px;letter-spacing:.04em;color:var(--ink);background:var(--mint);border:0;border-radius:999px;
  padding:14px 34px;cursor:pointer;box-shadow:0 5px 0 var(--mint-dark);pointer-events:auto}
button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--mint-dark)}
button:focus-visible{outline:3px solid var(--chalk);outline-offset:4px}
.mode{font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;box-shadow:none;
  background:transparent;color:var(--chalk);border:2px solid rgba(241,244,240,.5)}
.mode.hard{background:var(--coral);border-color:var(--coral);color:var(--ink)}
.mode:active{transform:none;box-shadow:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.screen{--glow:transparent;width:min(92vw,760px);max-width:100%;aspect-ratio:16/9;box-sizing:border-box;border:clamp(8px,2vw,14px) solid #0b0d0e;border-radius:6px;
  box-shadow:0 0 0 2px #23282a,0 20px 60px rgba(0,0,0,.7),0 0 90px var(--glow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35em;
  padding:4%;overflow:hidden;font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;text-align:center}
.screen .big{font-size:clamp(34px,10.5vw,96px);line-height:.9;letter-spacing:.01em;white-space:nowrap}
.screen .sub{font-size:clamp(15px,4vw,32px);line-height:1}
.screen em{font-style:normal}

function randomHoles(){
  const tall=window.innerHeight>window.innerWidth*1.15;R=tall?0.09:0.075;RATIO=tall?0.85:0.62;
  const ax=R+0.03, ay=(R+0.075)/RATIO;
  for(let tries=0;tries<500;tries++){
    const pts=[];let ok=true;
    for(let i=0;i<4&&ok;i++){
      let placed=false;
      for(let k=0;k<200&&!placed;k++){
        const fx=ax+Math.random()*(1-2*ax), fy=ay+Math.random()*(1-2*ay);
        placed=pts.every(([px,py])=>{

        if(placed)pts.push([fx,fy]);

      if(!placed)ok=false;

    if(ok){holeFr=pts;return;}

  const maxGh=sy-br*3-top; if(gh>maxGh){gh=Math.max(80,maxGh);gw=gh/RATIO;}
  const gx=(W-gw)/2, gy=Math.max(top,Math.min(H*0.42-gh*0.55,sy-br*3-gh));
  const r=gw*R;
  G={gw,gh,gx,gy,r,br,sx:W/2,sy,horizon:gy+gh,
     holes:holeFr.map(([fx,fy])=>[gx+gw*fx,gy+gh*fy])};
  // replace le ballon si la taille de l'écran change (ex. page ouverte avant d'être visible)
  try{if(ball&&ball.state==='ready'){ball.x=G.sx;ball.y=G.sy;}}catch(e){}
}
window.addEventListener('resize',layout);layout();

let filled=[false,false,false,false],shots=0,won=false;
let level=1;
// niveau 2 : gap = temps tout rouge (1 à 3 s, tiré au hasard à chaque partie)
const L2={gap:2000,t0:0,order:[],fixed:-1};
function remainingIdx(){return [0,1,2,3].filter(i=>!filled[i]);}
function setupL2Phase(now){
  const rem=remainingIdx();L2.t0=now;
  if(rem.length===4){L2.fixed=rem[Math.floor(Math.random()*4)];}
  else if(rem.length===3){L2.order=rem.slice().sort((a,b)=>G.holes[a][1]-G.holes[b][1]);}
  else{L2.order=rem.slice().sort(()=>Math.random()-.5);}
}
function greenAt(now){
  if(level!==2)return -1;
  const rem=remainingIdx();if(!rem.length)return -1;
  const dt=now-L2.t0;
  if(rem.length===4)return L2.fixed;
  if(rem.length===3)return L2.order[Math.floor(dt/3000)%3];
  const cyc=L2.gap+500,k=Math.floor(dt/cyc);
  return (dt%cyc)>=L2.gap?L2.order[k%L2.order.length]:-1;
}
// niveau 3 : chaque caisse a un minuteur (10, 12, 14, 16 s) affiché par sa barre LED
let lost=false;
// survivre 1 min 40 ; un ballon dans une caisse recharge sa barre à fond
const L3={t0:0,stop:0,total:30000,dur:[10000,12000,14000,16000],start:[0,0,0,0]};
function l3Frac(i,now){if(!started)return 1;return Math.min(1,Math.max(0,1-((L3.stop||now)-L3.start[i])/L3.dur[i]));}
const clockEl=document.getElementById('clock'),dotsWrap=document.getElementById('dotsWrap');
// niveaux 1 et 2 : temps limite
const LIMIT={1:60000,2:60000};
let gameT0=performance.now(),gameStop=0;
let started=false; // les chronos démarrent au premier tir
let clockTxt='';
function updateClock(now){
  const total=level===3?L3.total:LIMIT[level],t0=level===3?L3.t0:gameT0,stop=level===3?L3.stop:gameStop;
  const left=started?Math.max(0,total-((stop||now)-t0)):total,s=Math.ceil(left/1000);
  const t=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  if(t!==clockTxt){clockTxt=t;clockEl.textContent=t;clockEl.classList.toggle('low',s<=10);}
}
let ball, drag=null, fades=[];
function newBall(){ball={state:'ready',x:G.sx,y:G.sy,s:1,rot:0};}
newBall();

function updateHud(){
  dotsEl.forEach((d,i)=>d.classList.toggle('on',filled[i]));
  shotsEl.textContent='Tirs : '+shots;
}

let ac=null;
function beep(f1,f2,dur,type='triangle',vol=.18){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur);
  }catch(e){}
}

function aimFrom(dx,dy){
  const up=Math.max(1,-dy);
  const ax=G.sx+(dx/up)*(G.sy-(G.gy+G.gh/2))*1.05;
  const t=Math.min(1,Math.hypot(dx,dy)/Math.min(H*0.4,340));
  const ay=G.gy+G.gh*1.08-t*G.gh*1.3;
  return {ax,ay};
}

cv.addEventListener('pointerdown',e=>{
  if(won||ball.state!=='ready')return;
  try{if(!window.__wl&&navigator.wakeLock){window.__wl=1;navigator.wakeLock.request('screen').catch(()=>{});}}catch(err){}
  if(Math.hypot(e.clientX-ball.x,e.clientY-ball.y)>G.br*3)return;
  drag={x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,id:e.pointerId};
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{if(drag&&e.pointerId===drag.id){drag.x=e.clientX;drag.y=e.clientY;}});
cv.addEventListener('pointerup',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dx=drag.x-drag.x0,dy=drag.y-drag.y0;drag=null;
  if(dy>-25||Math.hypot(dx,dy)<30)return;
  const a=aimFrom(dx,dy),wob=G.gw*(hard?0.035:0.025);
  ball.state='flying';ball.t0=performance.now();
  ball.ax=a.ax+(Math.random()-.5)*wob;ball.ay=a.ay+(Math.random()-.5)*wob;
  if(!started){const t=performance.now();started=true;gameT0=t;L3.t0=t;L3.start=[t,t,t,t];}
  shots++;updateHud();hintEl.classList.add('off');
  beep(180,70,.15,'sine',.35);
});
cv.addEventListener('pointercancel',()=>{drag=null;});

function reset(){
  filled=[false,false,false,false];shots=0;won=false;winEl.hidden=true;hintEl.classList.remove('off');
  fades=[];randomHoles();layout();updateHud();newBall();
  if(level===2){L2.gap=1000+Math.random()*2000;setupL2Phase(performance.now());}
  lost=false;L3.stop=0;
  if(level===3){const t=performance.now();L3.t0=t;L3.start=[t,t,t,t];L3.dur=[10000,12000,14000,16000].sort(()=>Math.random()-.5);}
  gameT0=performance.now();gameStop=0;started=level===3;dotsWrap.hidden=level===3;clockTxt='';
  showMode();
}
document.getElementById('again').addEventListener('click',reset);
const nextBtn=document.getElementById('next'),lvlBtn=document.getElementById('lvl');
const titleEl=document.getElementById('title'),screenEl=document.getElementById('screen'),againBtn=document.getElementById('again');
function showEnd(type){
  screenEl.className='screen '+type;
  if(type==='ok'){titleEl.innerHTML='CELL COMPLET<em>ED</em>';winText.innerHTML='BONNE CHANCE POUR LES AUTRES <em>CELL</em>ULES';}
  else if(type==='fail'){titleEl.textContent='CELL FAILED';winText.textContent='QUITTEZ ET RÉESSAYEZ';}
  else{titleEl.innerHTML='LEVEL '+(level+1)+' <span class="u">U</span>NLOCKED';winText.textContent='RETOURNEZ DANS LA CELLULE POUR JOUER LE NIVEAU SUIVANT';}
  nextBtn.hidden=type!=='unlock';nextBtn.textContent='Niveau '+(level+1);
  againBtn.textContent=type==='fail'?'Réessayer':'Rejouer';
  winEl.hidden=false;
}
nextBtn.addEventListener('click',()=>{level=Math.min(3,level+1);reset();});
lvlBtn.addEventListener('click',()=>{level=level%3+1;reset();});
const modeBtn=document.getElementById('mode');
function showMode(){modeBtn.textContent='Mode : '+(hard?'Difficile':'Facile');modeBtn.classList.toggle('hard',hard);
  lvlBtn.textContent='Niveau '+level;
  hintEl.textContent=level===3?'Niveau 3 : tiens 30 secondes sans laisser une caisse s’éteindre':level===2?'Niveau 2 : tire seulement dans la caisse verte':(hard?'Mode difficile : pas de ligne de visée':'Touche le ballon et glisse vers le haut pour tirer');}
modeBtn.addEventListener('click',()=>{hard=!hard;try{localStorage.setItem('penalty-hard',hard?'1':'0');}catch(e){}showMode();reset();});
showMode();

function resolve(){
  const {ax,ay}=ball,m=G.br*0.42*0.4;
  if(lost){ball.state='drop';ball.t1=performance.now();ball.dy0=ball.y;return;}
  let hit=-1;
  G.holes.forEach(([hx,hy],i)=>{if(hit<0&&Math.abs(ax-hx)<G.r-m&&Math.abs(ay-hy)<G.r-m)hit=i;});
  if(level===3&&hit>=0){
    L3.start[hit]=performance.now();ball.state='in';
    beep(500,1200,.22,'square',.1);setTimeout(newBall,200);return;
  }
  if(hit>=0&&!filled[hit]&&(level!==2||greenAt(performance.now())===hit)){
    filled[hit]=true;ball.state='in';
    fades.push({i:hit,t0:performance.now(),c:'g',lv0:level===3?l3Frac(hit,performance.now()):1});
    if(level===2)setupL2Phase(performance.now());
    beep(700,180,.35,'square',.1);
    updateHud();
    if(filled.every(Boolean)){won=true;L3.stop=performance.now();gameStop=performance.now();setTimeout(()=>{
      showEnd('unlock');},900);}
    else setTimeout(newBall,200);
    return;
  }
  beep(140,90,.18,'triangle',.25);
  ball.state='drop';ball.t1=performance.now();ball.dy0=ball.y;
  setTimeout(newBall,300);
}

// ---- dessin
function pent(cx,cy,r,a){ctx.beginPath();for(let i=0;i<5;i++){const t=a+i*Math.PI*2/5-Math.PI/2;ctx.lineTo(cx+Math.cos(t)*r,cy+Math.sin(t)*r);}ctx.closePath();ctx.fill();}
function drawBall(x,y,r,rot,alpha=1){
  ctx.save();ctx.globalAlpha=alpha;
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle='#22385e';ctx.fill();
  ctx.save();ctx.clip();
  ctx.fillStyle='#0d1729';
  pent(x,y,r*0.36,rot);
  for(let i=0;i<5;i++){const t=rot+i*Math.PI*2/5-Math.PI/2;pent(x+Math.cos(t)*r*0.95,y+Math.sin(t)*r*0.95,r*0.33,rot+Math.PI);}
  ctx.strokeStyle='rgba(150,180,220,.35)';ctx.lineWidth=Math.max(1,r*0.05);
  for(let i=0;i<5;i++){const t=rot+i*Math.PI*2/5-Math.PI/2;ctx.beginPath();ctx.moveTo(x+Math.cos(t)*r*0.36,y+Math.sin(t)*r*0.36);ctx.lineTo(x+Math.cos(t)*r*0.7,y+Math.sin(t)*r*0.7);ctx.stroke();}
  const sh=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r*1.1);sh.addColorStop(0,'rgba(170,255,220,.28)');sh.addColorStop(1,'rgba(0,0,0,.45)');
  ctx.fillStyle=sh;ctx.fillRect(x-r,y-r,r*2,r*2);
  ctx.restore();
  ctx.strokeStyle='rgba(111,242,191,.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}
function poly(pts,fill){ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}}
function stripes(x0,y0,x1,y1,step,width,color,slope){
  // lignes parallèles de pente donnée qui balayent le rectangle (déjà clippé)
  ctx.strokeStyle=color;ctx.lineWidth=width;
  const h=y1-y0,span=Math.abs(slope)*h+ (x1-x0);
  for(let o=-Math.abs(slope)*h;o<span;o+=step){
    ctx.beginPath();ctx.moveTo(x0+o,y0);ctx.lineTo(x0+o+slope*h,y1);ctx.stroke();
  }
}
function vbars(x,y,w,h,n,color){const bw=w/(n*2-1);ctx.fillStyle=color;for(let i=0;i<n;i++)ctx.fillRect(x+i*bw*2,y,bw,h);}

const PAL={
  g:{inner:'c8ffe8',t:'86f0c4',r:'5fd9a8',b:'a6f7d6',l:'70e3b4',halo:'80,240,180',spot:'230,255,245',edge:'220,255,240'},
  r:{inner:'ffd2cc',t:'ff8a7d',r:'e0544a',b:'ffa89e',l:'ee6a5f',halo:'255,60,45',spot:'255,235,230',edge:'255,220,215'}};
function boxLight(i,now){
  if(!filled[i]&&level===3)return {lv:l3Frac(i,now),c:'g'};
  if(!filled[i])return {lv:1,c:(level===2&&greenAt(now)!==i)?'r':'g'};
  const f=fades.find(f=>f.i===i);if(!f)return {lv:0,c:'g'};
  const p=(now-f.t0)/450;if(p>=1)return {lv:0,c:f.c};
  return {lv:(f.lv0??1)*(1-p)*(Math.random()<.5?1:.35),c:f.c}; // petit grésillement en s'éteignant
}

function drawLed(hx,hy,r,f){
  const n=10,w=r*2,h=Math.max(5,r*0.17),x=hx-r,y=hy-r-h-r*0.3,sw=w/n;
  ctx.fillStyle='#070a09';ctx.fillRect(x-3,y-3,w+6,h+6);
  ctx.strokeStyle='#2a3533';ctx.lineWidth=1;ctx.strokeRect(x-3,y-3,w+6,h+6);
  for(let k=0;k<n;k++){
    const sx=x+k*sw+1,seg=Math.max(0,Math.min(1,f*n-k));
    ctx.fillStyle='#14201c';ctx.fillRect(sx,y,sw-2,h);
    if(seg>0){ctx.save();ctx.shadowColor='rgba(90,255,180,.9)';ctx.shadowBlur=r*0.35;
      ctx.fillStyle=`rgba(110,255,190,${0.25+0.75*seg})`;ctx.fillRect(sx,y,sw-2,h);ctx.restore();}
  }
}

function drawBox(hx,hy,r,lv,c){
  const P=PAL[c];
  const vx=W/2,vy=G.gy+G.gh*0.55; // point de fuite
  const ix=hx+(vx-hx)*0.07, iy=hy+(vy-hy)*0.07, ir=r*0.74;
  const O=[[hx-r,hy-r],[hx+r,hy-r],[hx+r,hy+r],[hx-r,hy+r]];
  const I=[[ix-ir,iy-ir],[ix+ir,iy-ir],[ix+ir,iy+ir],[ix-ir,iy+ir]];
  const mix=(a,b)=>{const pa=a.match(/\w\w/g).map(h=>parseInt(h,16)),pb=b.match(/\w\w/g).map(h=>parseInt(h,16));
    return 'rgb('+pa.map((v,k)=>Math.round(v+(pb[k]-v)*lv)).join(',')+')';};
  if(lv>0){ // halo
    ctx.save();ctx.globalCompositeOperation='lighter';
    const g=ctx.createRadialGradient(hx,hy,r*0.5,hx,hy,r*3);g.addColorStop(0,`rgba(${P.halo},${.45*lv})`);g.addColorStop(1,`rgba(${P.halo},0)`);
    ctx.fillStyle=g;ctx.fillRect(hx-r*3,hy-r*3,r*6,r*6);ctx.restore();
  }
  poly(I,mix('0a0f0e',P.inner));
  poly([O[0],O[1],I[1],I[0]],mix('1c2624',P.t));
  poly([O[1],O[2],I[2],I[1]],mix('141c1a',P.r));
  poly([O[2],O[3],I[3],I[2]],mix('101614',P.b));
  poly([O[3],O[0],I[0],I[3]],mix('18211f',P.l));
  if(lv>0){ // spot en haut
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=`rgba(${P.spot},${.9*lv})`;ctx.fillRect(ix-ir*0.25,iy-ir*0.98,ir*0.5,ir*0.08);
    const sp=ctx.createRadialGradient(ix,iy-ir*0.6,0,ix,iy-ir*0.6,ir*1.1);sp.addColorStop(0,`rgba(${P.spot},${.5*lv})`);sp.addColorStop(1,`rgba(${P.spot},0)`);
    ctx.fillStyle=sp;ctx.fillRect(ix-ir,iy-ir,ir*2,ir*2);ctx.restore();
  }
  ctx.strokeStyle=lv>0?`rgba(${P.edge},${.8*lv})`:'#2a3533';ctx.lineWidth=2;
  ctx.strokeRect(hx-r,hy-r,r*2,r*2);
}

function drawScene(now){
  const {gx,gy,gw,gh}=G, by=gy+gh;
  ctx.fillStyle='#050707';ctx.fillRect(0,0,W,H);

  // plafond + filet
  poly([[0,0],[W,0],[gx+gw,gy],[gx,gy]],'#0a0b0b');
  ctx.save();ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,0);ctx.lineTo(gx+gw,gy);ctx.lineTo(gx,gy);ctx.closePath();ctx.clip();
  const ng=ctx.createLinearGradient(0,0,0,gy);ng.addColorStop(0,'rgba(255,170,80,.28)');ng.addColorStop(1,'rgba(255,170,80,0)');
  ctx.strokeStyle=ng;ctx.lineWidth=1;
  for(let i=0;i<=24;i++){const t=i/24;ctx.beginPath();ctx.moveTo(t*W,0);ctx.lineTo(gx+t*gw,gy);ctx.stroke();}
  for(let j=1;j<14;j++){const t=Math.pow(j/14,1.6),y=gy*t;ctx.beginPath();ctx.moveTo(gx*t,y);ctx.lineTo(W-gx*t,y);ctx.stroke();}
  ctx.restore();

  // mur du fond
  ctx.save();ctx.beginPath();ctx.rect(gx,gy,gw,gh);ctx.clip();
  const split=gx+gw*0.47;
  ctx.fillStyle='#6f6a3d';ctx.fillRect(gx,gy,split-gx,gh);
  ctx.fillStyle='#9c1f1c';ctx.fillRect(split,gy,gx+gw-split,gh);
  vbars(gx+gw*0.03,gy,gw*0.16,gh*0.32,6,'#121414');
  ctx.save();ctx.beginPath();ctx.rect(split,gy+gh*0.05,gx+gw-split,gh*0.55);ctx.clip();
  stripes(split,gy,gx+gw,gy+gh*0.6,gw*0.045,gw*0.016,'#1e6866',0.9);ctx.restore();
  ctx.save();ctx.beginPath();ctx.rect(gx,gy+gh*0.55,gw*0.45,gh*0.45);ctx.clip();
  stripes(gx,gy+gh*0.55,gx+gw*0.45,by,gw*0.04,gw*0.014,'#1e6866',-0.9);
  stripes(gx+gw*0.22,gy+gh*0.55,gx+gw*0.47,by,gw*0.03,gw*0.012,'#b52a24',-0.9);ctx.restore();
  vbars(gx+gw*0.49,gy+gh*0.42,gw*0.13,gh*0.58,6,'#d9d6cc');
  ctx.fillStyle='#1a1a17';ctx.fillRect(gx+gw*0.82,gy+gh*0.62,gw*0.18,gh*0.38);
  vbars(gx+gw*0.83,gy+gh*0.62,gw*0.15,gh*0.38,6,'#7d1816');
  // ombre du mur (éclairage par le haut)
  const wg=ctx.createLinearGradient(0,gy,0,by);wg.addColorStop(0,'rgba(0,0,0,.6)');wg.addColorStop(.35,'rgba(0,0,0,.15)');wg.addColorStop(1,'rgba(0,0,0,.35)');
  ctx.fillStyle=wg;ctx.fillRect(gx,gy,gw,gh);
  ctx.restore();

  // murs latéraux
  [[[0,0],[gx,gy],[gx,by],[0,H*0.86]],[[W,0],[gx+gw,gy],[gx+gw,by],[W,H*0.86]]].forEach((p,s)=>{
    poly(p,'#5a1312');
    ctx.save();ctx.clip();
    const x0=s?gx+gw:0,x1=s?W:gx;
    stripes(Math.min(x0,x1),0,Math.max(x0,x1),H,Math.max(8,gx*0.18),Math.max(3,gx*0.06),'#17504c',s?-0.6:0.6);
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(Math.min(x0,x1),0,Math.abs(x1-x0),H);
    ctx.restore();
  });

  // sol moquette
  ctx.save();poly([[gx,by],[gx+gw,by],[W,H*0.86],[W,H],[0,H],[0,H*0.86]]);ctx.clip();
  ctx.fillStyle=carpetPat||'#0f5844';ctx.fillRect(0,by,W,H-by);
  const fg=ctx.createLinearGradient(0,by,0,H);fg.addColorStop(0,'rgba(0,0,0,.05)');fg.addColorStop(.55,'rgba(0,0,0,.35)');fg.addColorStop(1,'rgba(0,0,0,.85)');
  ctx.fillStyle=fg;ctx.fillRect(0,by,W,H-by);ctx.restore();

  // caisses
  const lights=G.holes.map((_,i)=>boxLight(i,now));
  G.holes.forEach(([hx,hy],i)=>drawBox(hx,hy,G.r,lights[i].lv,lights[i].c));
  if(level===3)G.holes.forEach(([hx,hy],i)=>drawLed(hx,hy,G.r,filled[i]?0:l3Frac(i,now)));

  // lumière au sol sous chaque caisse, puis faisceaux verts
  ctx.save();ctx.globalCompositeOperation='lighter';
  G.holes.forEach(([hx,hy],i)=>{
    const {lv,c}=lights[i];if(!lv)return;const h=PAL[c].halo;
    const fl=ctx.createRadialGradient(hx,by,0,hx,by,G.r*4);fl.addColorStop(0,`rgba(${h},${.16*lv})`);fl.addColorStop(1,`rgba(${h},0)`);
    ctx.fillStyle=fl;ctx.fillRect(hx-G.r*4,by-G.r*4,G.r*8,G.r*8);
  });
  ctx.restore();
  const lit=lights.reduce((s,L)=>s+(L.c==='g'?L.lv:0),0);
  if(lit>0){
    ctx.save();ctx.globalCompositeOperation='lighter';
    const a=0.05*lit;
    [[W*1.05,gy-gh*0.1,gx+gw*0.2,gy+gh*0.85],[W*1.05,gy+gh*0.05,gx+gw*0.45,gy+gh*0.75]].forEach(([x1,y1,x2,y2])=>{
      const bg=ctx.createLinearGradient(x1,y1,x2,y2);bg.addColorStop(0,`rgba(120,255,200,${a})`);bg.addColorStop(1,'rgba(120,255,200,0)');
      ctx.strokeStyle=bg;ctx.lineWidth=G.r*0.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    });
    ctx.restore();
  }
}

function ease(p){return 1-(1-p)*(1-p);}

function frame(now){
  if(started&&level===3&&!won&&filled.some((f,i)=>!f&&l3Frac(i,now)<=0)){
    won=true;lost=true;L3.stop=now;beep(320,60,.7,'sawtooth',.15);
    setTimeout(()=>showEnd('fail'),600);
  }
  if(started&&level===3&&!won&&now-L3.t0>=L3.total){
    won=true;L3.stop=now;beep(520,1040,.3,'square',.12);setTimeout(()=>beep(780,1560,.4,'square',.1),150);
    setTimeout(()=>showEnd('ok'),600);
  }
  if(started&&level!==3&&!won&&now-gameT0>=LIMIT[level]){
    won=true;lost=true;gameStop=now;beep(320,60,.7,'sawtooth',.15);
    setTimeout(()=>showEnd('fail'),600);
  }
  updateClock(now);
  drawScene(now);

  if(drag&&!hard){
    const dx=drag.x-drag.x0,dy=drag.y-drag.y0;
    if(dy<-10){
      const a=aimFrom(dx,dy);
      ctx.save();ctx.setLineDash([6,8]);ctx.strokeStyle='rgba(111,242,191,.6)';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.quadraticCurveTo((ball.x+a.ax)/2,(ball.y+a.ay)/2-H*0.1,a.ax,a.ay);ctx.stroke();
      ctx.setLineDash([]);ctx.lineWidth=2;ctx.beginPath();ctx.arc(a.ax,a.ay,G.br*0.5,0,Math.PI*2);ctx.stroke();ctx.restore();
    }
  }

  if(ball.state==='ready'){
    const bob=drag?0:Math.sin(now/300)*2;
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(ball.x,G.sy+G.br*0.95,G.br*0.9,G.br*0.25,0,0,Math.PI*2);ctx.fill();
    drawBall(ball.x,ball.y+bob,G.br,ball.rot);
    if(!drag&&shots===0){ctx.strokeStyle=`rgba(111,242,191,${.4+.4*Math.sin(now/250)})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(ball.x,ball.y,G.br*1.4,0,Math.PI*2);ctx.stroke();}
  } else if(ball.state==='flying'){
    const p=Math.min(1,(now-ball.t0)/420),e=ease(p);
    const x=G.sx+(ball.ax-G.sx)*e;
    const y=G.sy+(ball.ay-G.sy)*e-Math.sin(Math.PI*p)*H*0.07;
    const s=1-0.58*e;
    const shY=G.sy+(G.horizon-G.sy)*e+G.br*0.95*(1-e);
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x,shY,G.br*0.9*s,G.br*0.25*s,0,0,Math.PI*2);ctx.fill();
    ball.x=x;ball.y=y;ball.rot+=0.35;
    drawBall(x,y,G.br*s,ball.rot);
    if(p>=1){ball.x=ball.ax;ball.y=ball.ay;resolve();}
  } else if(ball.state==='drop'){
    const p=Math.min(1,(now-ball.t1)/300);
    const floor=G.horizon+G.br*0.4;
    const y=ball.dy0+(floor-ball.dy0)*Math.min(1,p*p*2.2)-(p>0.45?Math.sin(Math.PI*(p-0.45)/0.55)*G.br*0.6:0);
    ball.rot+=0.12;
    drawBall(ball.x,y,G.br*0.42,ball.rot,1-Math.max(0,(p-0.7)/0.3));
  }
  requestAnimationFrame(frame);
}
updateHud();
requestAnimationFrame(frame);
})();
</script>
